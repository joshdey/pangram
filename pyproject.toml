[project]
name = "pangram-slack-bot"
version = "0.1.0"
description = "A Slack mention bot that analyzes thread messages with Pangram."
requires-python = ">=3.12"
dependencies = [
    "pangram-sdk==1.0.0",
    "pydantic>=2.11.0,<3",
    "python-dotenv>=1.0.1",
    "slack-bolt>=1.21.0",
    "slack-sdk>=3.44.1,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
]

[project.scripts]
pangram-slack-bot = "pangram_slack.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pangram_slack"]

[tool.ruff]
line-length = 90
target-version = "py312"
