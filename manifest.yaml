display_information:
  name: Pangram
  description: Analyze a specific Slack message with Pangram.
  background_color: "#2f3c7e"
features:
  bot_user:
    display_name: Pangram
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
